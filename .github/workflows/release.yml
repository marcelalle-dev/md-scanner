name: Release

# Déclenché par un tag vX.Y.Z. Construit l'APK et l'AAB signés puis crée un
# brouillon de release GitHub. La mise en ligne sur Google Play reste manuelle :
# ce workflow ne publie rien sur le Play Store.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.44.5

jobs:
  release:
    name: Signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Require signing secrets
        if: env.HAS_SIGNING != 'true'
        run: |
          echo "::error::Signing secrets are missing (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). See docs/google-play-release.md."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Prepare build configuration
        env:
          AI_BACKEND_URL: ${{ vars.AI_BACKEND_URL }}
          PURCHASE_VERIFICATION_URL: ${{ vars.PURCHASE_VERIFICATION_URL }}
          ADMOB_BANNER_UNIT_ID: ${{ vars.ADMOB_BANNER_UNIT_ID }}
          ADMOB_INTERSTITIAL_UNIT_ID: ${{ vars.ADMOB_INTERSTITIAL_UNIT_ID }}
          ADMOB_REWARDED_UNIT_ID: ${{ vars.ADMOB_REWARDED_UNIT_ID }}
        run: python3 tool/ci/write_dart_defines.py dart_defines.json

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash tool/ci/configure_signing.sh

      - name: Build release APK
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: flutter build apk --release --dart-define-from-file=dart_defines.json

      - name: Build release App Bundle
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: flutter build appbundle --release --dart-define-from-file=dart_defines.json

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "md-scanner-${GITHUB_REF_NAME}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "md-scanner-${GITHUB_REF_NAME}.aab"
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "MD SCANNER ${GITHUB_REF_NAME}" \
            --generate-notes \
            "md-scanner-${GITHUB_REF_NAME}.apk" \
            "md-scanner-${GITHUB_REF_NAME}.aab"
