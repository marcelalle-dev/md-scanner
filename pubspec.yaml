name: md_scanner
description: "MD SCANNER - Numérisation et gestion documentaire tout-en-un"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Architecture
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  equatable: ^3.0.0
  collection: ^1.19.1
  intl: ^0.20.2
  uuid: ^4.6.0

  # Stockage local
  sqflite: ^2.4.6
  path: ^1.9.1
  path_provider: ^2.1.6

  # Numérisation et image
  google_mlkit_document_scanner: ^0.7.2
  camera: ^0.12.2
  image: ^4.13.1
  image_picker: ^1.2.4
  file_picker: ^13.4.1

  # OCR
  google_mlkit_text_recognition: ^1.0.3

  # QR codes et codes-barres
  mobile_scanner: ^7.5.0
  barcode_widget: ^2.0.4
  pretty_qr_code: ^3.6.0

  # PDF
  pdfrx: ^2.4.8
  pdf: ^3.13.1
  printing: ^5.15.1
  pdf_document: ^16.2.0

  # Export DOCX
  archive: ^4.7.1
  xml: ^7.0.1

  # Sécurité
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  crypto: ^3.0.8

  # Monétisation
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  google_mobile_ads: ^9.2.0

  # Plateforme
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  open_filex: ^5.0.0
  connectivity_plus: ^7.3.2
  package_info_plus: ^10.2.2
  permission_handler: ^13.0.2
  http: ^1.6.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/icon_foreground.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
